<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Chic Boutique</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container header-content">
      <a href="index.html" class="logo">Chic<span>Boutique</span></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="cart.html" id="cart-link">Cart (<span id="cart-count">0</span>)</a>
        <span id="auth-links">
          <a href="login.html">Login</a> &nbsp;|&nbsp;
          <a href="signup.html">Sign Up</a>
        </span>
      </nav>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="container auth-container">
    <div class="auth-box">
      <h2>Create an Account</h2>

      <form id="signup-form">
        <label for="signup-name">Full Name</label>
        <input type="text" id="signup-name" required>

        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" required>

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" required>

        <label for="signup-confirm-password">Confirm Password</label>
        <input type="password" id="signup-confirm-password" required>

        <p class="error-message" id="signup-error"></p>

        <button type="submit" class="btn">Sign Up</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Chic Boutique. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/header.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
