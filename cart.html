<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart - Chic Boutique</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cart.css" />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="site-header">
      <div class="container header-content">
        <a href="index.html" class="logo">Chic<span>Boutique</span></a>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="cart.html" id="cart-link"
            >Cart (<span id="cart-count">0</span>)</a
          >
          <span id="auth-links">
            <a href="login.html">Login</a> &nbsp;|&nbsp;
            <a href="signup.html">Sign Up</a>
          </span>
        </nav>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container cart-container">
      <h2>Your Shopping Cart</h2>

      <p id="empty-cart-message" style="display: none">
        Your cart is empty. <a href="index.html">Continue shopping</a>
      </p>

      <!-- cart items get added here by cart.js -->
      <div id="cart-items"></div>

      <div class="cart-summary">
        <h3>Total: <span id="cart-total">$0.00</span></h3>
        <button id="checkout-btn" class="btn">Checkout</button>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Chic Boutique. All rights reserved.</p>
      </div>
    </footer>

    <!-- <script src="js/storage.js"></script>
  <script src="js/header.js"></script>
  <script src="js/cart.js"></script> -->
  </body>
</html>
